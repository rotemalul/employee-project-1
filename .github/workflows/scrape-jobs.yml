name: Scrape PM jobs

on:
  schedule:
    # 06:00 UTC ≈ 08:00 (קיץ) / 09:00 (חורף) שעון ישראל.
    # הערה: טריגר schedule רץ רק כשהקובץ נמצא ב-default branch של ה-repo.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # כדי לעשות commit ל-data/*.json
  pages: write      # פרסום הדשבורד ל-GitHub Pages
  id-token: write   # נדרש ל-deploy-pages

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

defaults:
  run:
    working-directory: pm-job-scraper

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pm-job-scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/jobs.json data/companies.json data/history.json data/ats_cache.json
            git commit -m "chore: update job listings ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Stage data for Pages
        run: |
          cp data/jobs.json docs/jobs.json
          cp data/companies.json docs/companies.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # מפעיל אוטומטית GitHub Pages (source = GitHub Actions)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pm-job-scraper/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
