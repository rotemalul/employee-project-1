name: Scrape PM jobs

on:
  schedule:
    # פעמיים ביום. השעות ב-UTC; ישראל קיץ = UTC+3, חורף = UTC+2.
    - cron: "0 5 * * *"    # 08:00 שעון ישראל (קיץ) / 07:00 (חורף)
    - cron: "0 13 * * *"   # 16:00 שעון ישראל (קיץ) / 15:00 (חורף)
    # הערה: טריגר schedule רץ רק כשהקובץ נמצא ב-default branch של ה-repo.
  workflow_dispatch:
    inputs:
      harvest_comeet:
        description: "סריקת Comeet עם דפדפן (איטי) — לחילוץ tokens חדשים"
        type: boolean
        default: false

permissions:
  contents: write   # כדי לעשות commit ל-data/*.json
  pages: write      # פרסום הדשבורד ל-GitHub Pages
  id-token: write   # נדרש ל-deploy-pages

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

defaults:
  run:
    working-directory: pm-job-scraper

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pm-job-scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Browser only needed for the (manual) Comeet harvest — skip it on the
      # fast scheduled runs.
      - name: Install Playwright Chromium
        if: ${{ inputs.harvest_comeet }}
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          HARVEST_COMEET: ${{ inputs.harvest_comeet }}
        run: python -m scraper

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/jobs.json data/companies.json data/history.json data/ats_cache.json data/runs.json
            git commit -m "chore: update job listings ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Stage data for Pages
        run: |
          cp data/jobs.json docs/jobs.json
          cp data/companies.json docs/companies.json
          cp data/runs.json docs/runs.json 2>/dev/null || echo '{"runs":[]}' > docs/runs.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # מפעיל אוטומטית GitHub Pages (source = GitHub Actions)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pm-job-scraper/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
