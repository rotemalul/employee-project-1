# רשימת חברות לסריקה.
#
# חשוב:
#  * חברות סייבר *לא* נכללות כאן במכוון — זו ההחרגה הנדרשת.
#  * זו רשימת *בסיס* לדוגמה כדי להריץ end-to-end. הרשימה המלאה (חברות
#    ישראליות + בינלאומיות עם נוכחות בישראל) נבנית כמשימת מחקר נפרדת.
#  * ה-`token` של כל חברה צריך אימות מול הפלטפורמה — אם token שגוי,
#    הסקרייפר פשוט ידלג על אותה חברה וירשום שגיאה (לא יקרוס).
#
# שדות:
#   name      - שם תצוגה
#   ats       - comeet | greenhouse | lever
#   token     - מזהה החברה בפלטפורמה
#   uid       - (ל-Comeet בלבד) מזהה החברה הנוסף
#   homepage  - קישור לעמוד הקריירה (לתיעוד)
#   category  - תיוג חופשי (אל תשתמשו ב-cyber)

